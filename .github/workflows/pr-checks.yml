name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: betterticket
          POSTGRES_PASSWORD: betterticket_ci
          POSTGRES_DB: betterticket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betterticket -d betterticket"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://betterticket:betterticket_ci@localhost:5432/betterticket
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage/
            apps/*/coverage/
          if-no-files-found: ignore

  infrastructure-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: bash scripts/smoke.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --redact --no-banner
